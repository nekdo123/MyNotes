<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/stil.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
</head>
<body class="bg-black text-white m-2">
<main>
    <div class="container-fluid px-3" id="mainScreen">
        <div class="row mt-3" id="naslov">
            <h1>Moji zapiski</h1>

        </div>
        
            
        <div class="row mt-4 gx-0 d-flex justify-content-between">
            <div class="col" id="ime">
                Zapiski
            </div>

            <div class="col-auto" id="noteCount">
                <p class="pt-2 text-black" style="font-weight:bold;">0</p>
            </div>
        </div>

        <hr>


        <ul class="list-group" id="notes"></ul>


    </div>


    <div class="container-fluid px-4" id="bottom">
        
        <div class="row d-flex align-items-center justify-content-between gx-0">
            
            <div class="col-auto" id="ime">
                <form>
                    <div class="input-group">
                        <span class="input-group-text" id="lupa">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="gray" class="bi bi-search" viewBox="0 0 16 16">
                            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                            </svg></span>
                        <input type="text" class="form-control" id="searchArea" placeholder="Išči zapiske...">
                    </div>
                </form>

            </div>


            <button id="addNote" class="btn bg-warning rounded-circle">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16">
                    <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                    <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                </svg>
            </button>

        </div>
    </div>

</main>
<script src="js/skripta.js"></script>

</body>
</html>
